[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backend"
version = "0.1.0"
description = "Agricultural Export Trade Analytics Backend"
requires-python = ">=3.12"
dependencies = [
    "pwdlib[argon2]>=0.2.0",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "google-genai>=2.20.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "uvicorn>=0.52.4",
    "sqlalchemy>=2.0.48",
    "alembic>=1.18.4",
    "psycopg[binary]>=3.3.3",
    "google-auth[requests]>=2.49.1",
    "PyJWT>=2.10.1,<3",
    "httpx>=0.28.1",
    "python-dateutil>=2.9.0.post0",
    "reportlab>=4.4.10",
    "uharfbuzz>=0.52.0",
    "pypdf>=6.0.0",
    "olefile>=0.47",
    "qrcode>=8.0",
]

[dependency-groups]
dev = ["pytest>=9.0.2", "python-pptx>=1.0.2"]

[project.scripts]
dev = "app.main:start"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
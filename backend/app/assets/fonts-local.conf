<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Metric-compatible aliases for common Microsoft PowerPoint fonts -->
  <match target="pattern">
    <test name="family"><string>Calibri (MS)</string></test>
    <edit name="family" mode="assign" binding="same"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Calibri</string></test>
    <edit name="family" mode="assign" binding="same"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Cambria</string></test>
    <edit name="family" mode="assign" binding="same"><string>Caladea</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times New Roman Bold</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Serif</string></edit>
    <edit name="weight" mode="assign" binding="same"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times New Roman Italics</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Serif</string></edit>
    <edit name="slant" mode="assign" binding="same"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial Bold</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
    <edit name="weight" mode="assign" binding="same"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="same"><string>Liberation Sans</string></edit>
  </match>
</fontconfig>


# ==============================================================================
# ADMIT TRADING — Production Docker Compose Configuration
# Complete multi-service production deployment stack with healthchecks & volumes.
# ==============================================================================

name: admittrading

services:
  postgres:
    image: postgres:16-alpine
    container_name: admit_postgres_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agritrade}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - admit_internal

  redis:
    image: redis:7-alpine
    container_name: admit_redis_prod
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["/bin/sh", "-ec", 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else exec redis-server --appendonly yes; fi']
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "$$REDIS_PASSWORD" ]; then REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      - admit_internal

  migrate:
    image: admittrading-migrate:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admit_migrate_prod
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agritrade}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - admit_internal

  backend:
    image: admittrading-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admit_backend_prod
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--no-access-log"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agritrade}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      STORAGE_PATH: /var/lib/agritrade
    volumes:
      - agritrade_storage:/var/lib/agritrade
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - admit_internal
      - admit_public

  worker:
    image: admittrading-worker:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admit_worker_prod
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agritrade}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      STORAGE_PATH: /var/lib/agritrade
    volumes:
      - agritrade_storage:/var/lib/agritrade
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - admit_internal

  frontend:
    image: admittrading-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: admit_frontend_prod
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - admit_public

  admin:
    image: admittrading-admin:latest
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: admit_admin_prod
    ports:
      - "${ADMIN_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - admit_public

volumes:
  postgres_prod_data:
  redis_prod_data:
  agritrade_storage:

networks:
  admit_internal:
    driver: bridge
  admit_public:
    driver: bridge
